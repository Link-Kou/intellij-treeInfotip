# 插件版本（唯一版本来源，build.gradle 与 plugin.xml 都由此驱动）
pluginVersion=5.3.2

# 开发/编译使用的 IntelliJ 平台版本
platformVersion=2022.3.2
platformType=IU

# 构建插件时使用的 Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# 不要把 kotlin-stdlib 打进插件：IDE 自己带了一份，重复会冲突。
# 编译期由 build.gradle 里的 compileOnly kotlin-stdlib 提供。
kotlin.stdlib.default.dependency=false

# 注意：不要在此提交 org.gradle.java.home，它是机器相关的路径，会导致其他机器与 CI 构建失败。
# 需要指定本机 JDK 请写入 gradle.properties 的本地副本或使用环境变量 JAVA_HOME。
