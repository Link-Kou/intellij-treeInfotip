name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle-intellij-plugin 1.13.2 + 平台 2022.3 需要 JDK 17，JDK 8 无法运行
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库中没有提交 Gradle wrapper，这里直接安装指定版本的 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Read plugin version
        id: meta
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::pluginVersion not found in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TreeInfotip version: $version"

      - name: Build plugin
        run: gradle --no-daemon clean buildPlugin verifyPlugin

      - name: Run tests
        run: gradle --no-daemon test

      - name: List distributions
        run: ls -lh build/distributions

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeInfotip-${{ steps.meta.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

  verify-compatibility:
    name: IntelliJ Plugin Verifier
    runs-on: ubuntu-latest
    # 该检查会下载完整 IDE（较慢），且历史遗留告警较多，
    # 因此不阻塞主流程，仅作为兼容性报告使用。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      # 同时校验编译目标版本与用户报障的新版本，防止再次出现
      # AllIcons 字段在新版本被移除导致运行期崩溃的问题
      - name: Run plugin verifier
        run: gradle --no-daemon runPluginVerifier -PverifierIdeVersions=IU-2022.3.2,IU-2026.2

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
