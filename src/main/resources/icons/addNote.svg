<!-- 右键菜单「目录备注」分组的图标。原图是 128×128，这里只把 width/height 改成 16：
     平台的 SvgLoader 按根标签声明的尺寸决定逻辑大小，128 会把菜单行整个撑高。
     viewBox 保持 1024 不动，路径坐标不用换算。
     彩色图标不需要 _dark 变体：黄底青圆在两个主题下都够清楚。 -->
